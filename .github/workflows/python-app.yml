name: Python Application

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Scheduled Testing

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      run: pipx install uv

    - name: Configure SSH for private candela-scoring dependency
      uses: webfactory/ssh-agent@v0.9.1
      with:
        ssh-private-key: ${{ secrets.CANDELA_SSH_KEY }}

    - name: Check lock file and sync dependencies
      run: uv sync --group dev --locked --no-cache

    - name: Lint formatting
      run: uv run black --check .

    - name: Write secrets for expensive tests
      env:
        MODELLAB_FILE_DOWNLOAD_TOKEN: ${{ secrets.MODELLAB_FILE_DOWNLOAD_TOKEN }}
      run: |
        if [ -z "$MODELLAB_FILE_DOWNLOAD_TOKEN" ]; then
          echo "MODELLAB_FILE_DOWNLOAD_TOKEN is not set on the Scheduled Testing environment."
          exit 1
        fi
        mkdir -p config
        cat > config/secrets.toml << EOF
        [modellab_files]
        token = "${MODELLAB_FILE_DOWNLOAD_TOKEN}"

        [demo]
        api_key = "12345"
        EOF

    - name: Test with pytest
      run: uv run pytest --expensive-tests

    - name: Run mypy
      run: uv run mypy --follow-imports silent --exclude modelbench src/modelgauge
