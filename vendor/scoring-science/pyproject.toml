[project]
name = "scoring-science"
version = "0.2.0"
description = "Scoring science for the Safety 1.2.1 and Security 1.1 benchmarks (science-team owned)."
license = "Apache-2.0"
requires-python = ">=3.12,<4"
dependencies = [
    "jsonschema>=4.26.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scoring_science = ["*.json", "*.md"]
